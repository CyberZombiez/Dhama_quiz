<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>ธรรมศึกษา มัธยม — แบบฝึกข้อสอบ</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai",Tahoma,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 6px 22px #17203318;margin-bottom:14px}h1{font-size:28px;margin:0 0 6px}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{font-weight:700;font-size:14px}select,button{width:100%;font:inherit;border:1px solid #d0d5dd;border-radius:12px;padding:12px;background:#fff}button{font-weight:700;cursor:pointer}.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}.danger{color:#b42318}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:999px;background:#f2f4f7}.q{font-size:23px;line-height:1.5;margin:14px 0}.choice{display:block;border:1px solid #d0d5dd;border-radius:14px;padding:13px;margin:9px 0;font-size:18px}.choice input{transform:scale(1.25);margin-right:10px}.correct{border-color:#12b76a;background:#ecfdf3}.wrong{border-color:#f04438;background:#fef3f2}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.note{background:#fffaeb;border:1px solid #fedf89;border-radius:12px;padding:12px}.hidden{display:none}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}h1{font-size:23px}.q{font-size:20px}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="card"><h1>ธรรมศึกษา • ระดับมัธยมศึกษา</h1><div class="muted">แบบฝึกตามบทเรียน + สุ่มข้อสอบย้อนหลัง • รุ่นฐานข้อมูลหลายปี</div></div>
<div class="card"><div class="grid"><div><label>ชั้น</label><select id="cls"><option>ตรี</option><option>โท</option><option>เอก</option></select></div><div><label>ปีข้อสอบ</label><select id="year"><option value="all">ทุกปีที่นำเข้าแล้ว</option><option>2563</option><option>2565</option><option>2566</option><option>2567</option><option>2568</option></select></div><div><label>วิชา</label><select id="subject"><option value="all">ทุกวิชา</option><option>ธรรม</option><option>พุทธประวัติ</option><option>เบญจศีลเบญจธรรม</option><option>อนุพุทธประวัติและศาสนพิธี</option><option>อุโบสถศีล</option><option>กรรมบถ</option></select></div><div><label>เนื้อหาที่ต้องการฝึก</label><select id="topic"><option value="all">ทุกเนื้อหา</option></select></div><div><label>จำนวนข้อ</label><select id="count"><option>10</option><option>20</option><option>30</option><option selected>50</option><option value="all">ทั้งหมดที่พบ</option></select></div><div style="align-self:end"><button class="primary" id="start">เริ่ม / สุ่มข้อสอบ</button></div></div></div>
<div class="card note" id="status"></div><div class="card hidden" id="quiz"><div class="stats"><span class="pill" id="prog"></span><span class="pill" id="score"></span><span class="pill" id="meta"></span></div><div class="q" id="q"></div><div id="choices"></div><div id="feedback" class="muted"></div><div class="nav"><button id="prev">← ก่อนหน้า</button><button id="next" class="primary">ถัดไป →</button></div><div class="nav"><button id="reset" class="danger">ล้างคำตอบ (คงลำดับเดิม)</button><button id="reshuffle">สุ่มลำดับใหม่</button></div></div></div>
<script>
const DB=[
{y:2565,c:'ตรี',s:'ธรรม',chapter:'บทที่ 2 ธรรมหมวด 2',t:'กรรมฐาน 2',n:1,q:'สมถกรรมฐานเป็นอุบายทำให้อะไรสงบ ?',o:['กาย','วาจา','ใจ','ปัญญา'],a:2},
{y:2565,c:'ตรี',s:'ธรรม',chapter:'บทที่ 2 ธรรมหมวด 2',t:'กรรมฐาน 2',n:2,q:'วิปัสสนากรรมฐานเป็นอุบายให้เกิดอะไร ?',o:['ศีล','สมาธิ','ปัญญา','ฌาน'],a:2},
{y:2565,c:'ตรี',s:'ธรรม',chapter:'บทที่ 2 ธรรมหมวด 2',t:'กรรมฐาน 2',n:3,q:'การเจริญวิปัสสนากรรมฐานมีประโยชน์อย่างไร ?',o:['ทำให้จิตสงบ','ทำให้รู้แจ้ง','ทำให้จิตผ่องใส','ทำให้เบื่อหน่าย'],a:1},
{y:2566,c:'ตรี',s:'ธรรม',chapter:'บทที่ 2 ธรรมหมวด 2',t:'กาม 2',n:4,q:'กิเลสกาม หมายถึงกิเลสใด ?',o:['ราคะ','โลภะ','อิจฉา','ถูกทุกข้อ'],a:3},
{y:2566,c:'ตรี',s:'ธรรม',chapter:'บทที่ 2 ธรรมหมวด 2',t:'กาม 2',n:5,q:'วัตถุกาม หมายถึงอะไร ?',o:['รูปสวย','เสียงไพเราะ','กลิ่นหอม','ถูกทุกข้อ'],a:3},
{y:2566,c:'ตรี',s:'ธรรม',chapter:'บทที่ 2 ธรรมหมวด 2',t:'กาม 2',n:6,q:'วัตถุกาม จัดเป็นอะไร ?',o:['มาร','บ่วงแห่งมาร','เทวปุตตมาร','มัจจุมาร'],a:1},
{y:2566,c:'ตรี',s:'ธรรม',chapter:'บทที่ 2 ธรรมหมวด 2',t:'บูชา 2',n:7,q:'การบูชาด้วยเครื่องสักการะ เรียกว่าอะไร ?',o:['อามิสบูชา','ปฏิปัตติบูชา','อามิสปฏิสันถาร','ธัมมปฏิสันถาร'],a:0},
{y:2567,c:'ตรี',s:'ธรรม',chapter:'บทที่ 2 ธรรมหมวด 2',t:'กาม 2',n:5,q:'สิ่งใด ไม่ใช่วัตถุกาม ?',o:['เงิน','ทอง','ธนบัตร','สิ่งปฏิกูล'],a:3},
{y:2567,c:'ตรี',s:'ธรรม',chapter:'บทที่ 2 ธรรมหมวด 2',t:'กาม 2',n:6,q:'วัตถุกามคล้องผูกจิตบุคคล จึงเรียกว่าอะไร ?',o:['มาร','บ่วงแห่งมาร','เทวปุตตมาร','มัจจุมาร'],a:1},
{y:2567,c:'ตรี',s:'ธรรม',chapter:'บทที่ 2 ธรรมหมวด 2',t:'บูชา 2',n:7,q:'การบูชาด้วยการถวายอาหารและจีวร จัดเป็นการบูชาในข้อใด ?',o:['อามิสบูชา','ปฏิปัตติบูชา','อามิสปฏิสันถาร','ธัมมปฏิสันถาร'],a:0}
];
let pool=[],order=[],answers={},i=0;const L=['ก','ข','ค','ง'];const $=id=>document.getElementById(id);function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function updateTopics(){let c=$('cls').value,s=$('subject').value,y=$('year').value;let rows=DB.filter(x=>x.c===c&&(s==='all'||x.s===s)&&(y==='all'||x.y==y));let vals=[...new Set(rows.map(x=>x.t))].sort();$('topic').innerHTML='<option value="all">ทุกเนื้อหา</option>'+vals.map(v=>`<option>${v}</option>`).join('')}
['cls','year','subject'].forEach(id=>$(id).onchange=updateTopics);updateTopics();
function filter(){let c=$('cls').value,s=$('subject').value,y=$('year').value,t=$('topic').value;return DB.filter(x=>x.c===c&&(s==='all'||x.s===s)&&(y==='all'||x.y==y)&&(t==='all'||x.t===t))}
function start(){pool=filter();let n=$('count').value==='all'?pool.length:Math.min(+$('count').value,pool.length);order=shuffle(pool).slice(0,n);answers={};i=0;if(!order.length){$('quiz').classList.add('hidden');$('status').innerHTML='ยังไม่มีข้อที่นำเข้าในตัวกรองนี้ — ฐานข้อมูลรุ่นนี้กำลังขยายจากเอกสารทางการทีละปี/ชั้น';return}$('quiz').classList.remove('hidden');render();}
function render(){let x=order[i];$('prog').textContent=`ข้อสุ่ม ${i+1}/${order.length}`;$('score').textContent=`ถูก ${Object.values(answers).filter(v=>v.ok).length} • ผิด ${Object.values(answers).filter(v=>!v.ok).length}`;$('meta').textContent=`พ.ศ. ${x.y} • ${x.c} • ${x.s} • ต้นฉบับข้อ ${x.n}`;$('q').textContent=x.q;$('choices').innerHTML=x.o.map((v,k)=>`<label class="choice" id="ch${k}"><input type="radio" name="ans" ${answers[i]?.sel===k?'checked':''} value="${k}">${L[k]}. ${v}</label>`).join('');document.querySelectorAll('input[name=ans]').forEach(el=>el.onchange=()=>choose(+el.value));paint();$('feedback').textContent=`${x.chapter} • ${x.t}`;$('prev').disabled=i===0;$('next').textContent=i===order.length-1?'จบชุด':'ถัดไป →'}
function choose(k){let x=order[i];answers[i]={sel:k,ok:k===x.a};paint();$('score').textContent=`ถูก ${Object.values(answers).filter(v=>v.ok).length} • ผิด ${Object.values(answers).filter(v=>!v.ok).length}`}
function paint(){let x=order[i],a=answers[i];for(let k=0;k<4;k++){$('ch'+k)?.classList.remove('correct','wrong')}if(a){$('ch'+x.a).classList.add('correct');if(!a.ok)$('ch'+a.sel).classList.add('wrong')}}
$('start').onclick=start;$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<order.length-1){i++;render()}else alert(`จบชุด: ถูก ${Object.values(answers).filter(v=>v.ok).length} จาก ${order.length} ข้อ`)};$('reset').onclick=()=>{answers={};i=0;render()};$('reshuffle').onclick=()=>{order=shuffle(order);answers={};i=0;render()};
$('status').innerHTML=`รุ่นขยาย V2: เปิดโครงสร้างหลายปี 2563, 2565–2568 และ ตรี/โท/เอกแล้ว • ขณะนี้ข้อมูลคำถามที่ตรวจและนำเข้าในไฟล์นี้เป็นชุดเริ่มต้นของ ตรี–มัธยม วิชาธรรม ปี 2565–2567 จำนวน ${DB.length} ข้อ • ตัวกรองที่ยังไม่มีข้อมูลจะแจ้งตรง ๆ แทนการสร้างข้อสอบขึ้นเอง`;
</script></body></html>

<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>ธรรมศึกษา — ฝึกตามเนื้อหา</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:#29251f;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai",Tahoma,sans-serif;font-size:18px;line-height:1.55}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd5c8;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}h1{margin:0;font-size:30px}.sub,.note,.meta{color:#756e63}.meta,.note{font-size:15px}label{font-weight:700}select,button{width:100%;font:inherit;padding:12px;border:1px solid #ddd5c8;border-radius:12px;background:#fff}button{font-weight:700}.primary{background:#2f4b3c;color:white;border:0}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row button{flex:1;min-width:150px}.stats{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:700}.pill{background:#eee8dd;padding:6px 10px;border-radius:999px}.q{font-size:24px;font-weight:750;margin:10px 0}.choice{text-align:left;margin:8px 0}.correct{background:#e8f5e9}.wrong{background:#fdecec}.selected{outline:3px solid #c9b98e}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:11px}.q{font-size:21px}}</style></head><body><main class="wrap">
<h1>ธรรมศึกษา — ฝึกตามเนื้อหา</h1><div class="sub">ต้นแบบใช้งานจริงรุ่นที่ 1 • ชั้นตรี • ระดับมัธยมศึกษา</div>
<section class="card"><div class="grid">
<div><label>ชั้น</label><select><option>ตรี</option><option disabled>โท — กำลังเพิ่ม</option><option disabled>เอก — กำลังเพิ่ม</option></select></div>
<div><label>วิชา</label><select><option>ธรรมวิภาค</option><option disabled>พุทธประวัติ — กำลังจัดบท</option><option disabled>เบญจศีลและเบญจธรรม — กำลังจัดบท</option></select></div>
<div><label>เนื้อหาที่ต้องการฝึก</label><select id="chapter"><option value="all">ทุกบท</option><option>บทที่ 1 ความรู้เบื้องต้นเกี่ยวกับธรรมวิภาค</option><option selected>บทที่ 2 ธรรมหมวด 2 (ทุกะ)</option><option>บทที่ 3 ธรรมหมวด 3 (ติกะ)</option><option>บทที่ 4 ธรรมหมวด 4 (จตุกกะ)</option><option>บทที่ 5 คิหิปฏิบัติ</option></select></div>
<div><label>หัวข้อย่อย</label><select id="topic"></select></div>
<div><label>ปีข้อสอบ</label><select id="year"><option value="all">ทุกปีที่มีข้อมูล</option><option value="2568">2568</option></select></div>
<div><label>จำนวนข้อ</label><select id="count"><option value="all">ทั้งหมดที่พบ</option><option value="5">5 ข้อ</option></select></div>
</div><p class="note" id="found"></p><div class="row"><button class="primary" onclick="start()">เริ่มทำแบบทดสอบ</button><button onclick="start()">สุ่มชุดใหม่</button></div></section>
<section id="quiz" class="card hidden"><div class="stats"><span id="progress" class="pill"></span><span>ถูก <b id="good">0</b> • ผิด <b id="bad">0</b></span></div><div id="meta" class="meta"></div><div id="question" class="q"></div><div id="choices"></div><div class="row"><button onclick="prev()">← ก่อนหน้า</button><button onclick="next()">ถัดไป →</button></div><div class="row"><button onclick="resetA()">↺ รีเซ็ตการเลือก</button><button onclick="start()">⤨ สุ่มชุดใหม่</button></div></section>
<section class="card"><b>สถานะข้อมูล</b><p class="note">รุ่นแรกใส่ข้อสอบสนามหลวง พ.ศ. ๒๕๖๘ วิชาธรรม ข้อ ๑–๘ และติดแท็ก กรรมฐาน ๒ / กาม ๒ / บูชา ๒ เพื่อทดสอบระบบกรองจริงก่อนขยายเป็นข้อ ๑–๕๐ และวิชาอื่น</p></section>
</main><script>
const DB=[{"id": 1, "year": "2568", "original": 1, "chapter": "บทที่ 2 ธรรมหมวด 2 (ทุกะ)", "topic": "กรรมฐาน 2", "q": "กรรมฐาน มีกี่ประเภท ?", "choices": ["๒", "๓", "๔", "๕"], "answer": 0}, {"id": 2, "year": "2568", "original": 2, "chapter": "บทที่ 2 ธรรมหมวด 2 (ทุกะ)", "topic": "กรรมฐาน 2", "q": "การเจริญสมถกรรมฐาน มีวัตถุประสงค์เพื่ออะไร ?", "choices": ["แสดงฤทธิ์", "แสดงภูมิ", "ระงับนิวรณ์", "ตัดกิเลส"], "answer": 2}, {"id": 3, "year": "2568", "original": 3, "chapter": "บทที่ 2 ธรรมหมวด 2 (ทุกะ)", "topic": "กรรมฐาน 2", "q": "ข้อใด จัดเป็นอารมณ์วิปัสสนากรรมฐาน ?", "choices": ["ขันธ์ ๕", "อายตนะ ๑๒", "ธาตุ ๑๘", "ถูกทุกข้อ"], "answer": 3}, {"id": 4, "year": "2568", "original": 4, "chapter": "บทที่ 2 ธรรมหมวด 2 (ทุกะ)", "topic": "กาม 2", "q": "ความกำหนัด ความโลภ ความริษยา จัดเป็นกามประเภทใด ?", "choices": ["กิเลสกาม", "วัตถุกาม", "กามคุณ", "กามภพ"], "answer": 0}, {"id": 5, "year": "2568", "original": 5, "chapter": "บทที่ 2 ธรรมหมวด 2 (ทุกะ)", "topic": "กาม 2", "q": "เงิน ทอง ธนบัตร จัดเป็นกามประเภทใด ?", "choices": ["กิเลสกาม", "วัตถุกาม", "กามเทพ", "กามภพ"], "answer": 1}, {"id": 6, "year": "2568", "original": 6, "chapter": "บทที่ 2 ธรรมหมวด 2 (ทุกะ)", "topic": "กาม 2", "q": "กิเลสกาม จัดเป็นมารเพราะส่งผลอย่างไรต่อบุคคล ?", "choices": ["ผลาญความดี", "จิตใจตกต่ำ", "ทำให้เสียคน", "ถูกทุกข้อ"], "answer": 3}, {"id": 7, "year": "2568", "original": 7, "chapter": "บทที่ 2 ธรรมหมวด 2 (ทุกะ)", "topic": "บูชา 2", "q": "การบูชาด้วยการถวายอาหารและจีวร จัดเป็นการบูชาในข้อใด ?", "choices": ["อามิสบูชา", "ปฏิปัตติบูชา", "อามิสปฏิสันถาร", "ธัมมปฏิสันถาร"], "answer": 0}, {"id": 8, "year": "2568", "original": 8, "chapter": "บทที่ 2 ธรรมหมวด 2 (ทุกะ)", "topic": "บูชา 2", "q": "การบูชาด้วยการลงมือทำ ได้แก่ข้อใด ?", "choices": ["อามิสบูชา", "ปฏิปัตติบูชา", "อามิสปฏิสันถาร", "ธัมมปฏิสันถาร"], "answer": 1}],L=["ก","ข","ค","ง"];let order=[],idx=0,ans={};
function filt(){let c=chapter.value,t=topic.value,y=year.value;return DB.filter(x=>(c==="all"||x.chapter===c)&&(t==="all"||x.topic===t)&&(y==="all"||x.year===y))}
function topics(){let c=chapter.value,a=[...new Set(DB.filter(x=>c==="all"||x.chapter===c).map(x=>x.topic))];topic.innerHTML='<option value="all">ทุกหัวข้อ</option>'+a.map(x=>`<option>${x}</option>`).join("");found.textContent=`พบ ${filt().length} ข้อในฐานข้อมูลรุ่นนี้`}
function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){let a=filt();if(!a.length){alert("หัวข้อนี้ยังไม่มีข้อสอบในฐานข้อมูลรุ่นแรก");return}let n=count.value==="all"?a.length:Math.min(+count.value,a.length);order=sh(a).slice(0,n);idx=0;ans={};quiz.classList.remove("hidden");render();quiz.scrollIntoView({behavior:"smooth"})}
function render(){let x=order[idx];progress.textContent=`ข้อ ${idx+1} / ${order.length}`;meta.textContent=`พ.ศ. ${x.year} • ข้อสอบต้นฉบับข้อ ${x.original} • ${x.chapter} • ${x.topic}`;question.textContent=x.q;choices.innerHTML="";x.choices.forEach((c,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=`${L[i]}. ${c}`;if(ans[x.id]!==undefined){if(i===x.answer)b.classList.add("correct");if(i===ans[x.id]&&i!==x.answer)b.classList.add("wrong");if(i===ans[x.id])b.classList.add("selected")}b.onclick=()=>{ans[x.id]=i;render()};choices.appendChild(b)});let g=0,d=0;order.forEach(z=>{if(ans[z.id]!==undefined)ans[z.id]===z.answer?g++:d++});good.textContent=g;bad.textContent=d}
function next(){if(idx<order.length-1){idx++;render()}}function prev(){if(idx){idx--;render()}}function resetA(){ans={};idx=0;render()}
chapter.onchange=topics;topic.onchange=()=>found.textContent=`พบ ${filt().length} ข้อในฐานข้อมูลรุ่นนี้`;year.onchange=topics;topics();
</script></body></html>
